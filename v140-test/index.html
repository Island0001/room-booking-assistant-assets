<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="予約TEST">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fff7ed">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta http-equiv="Pragma" content="no-cache">
  <title>会議室予約 v1.4 テスト</title>
  <link rel="icon" type="image/png" sizes="512x512" href="../app_icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff7ed;color:#431407}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px}
    .card{width:min(480px,100%);display:grid;gap:16px;background:#fff;border:1px solid #fed7aa;border-radius:20px;padding:22px;box-shadow:0 18px 48px rgba(124,45,18,.15)}
    .icon{width:82px;height:82px;border-radius:20px;margin:auto}
    h1,p{margin:0;text-align:center}
    h1{font-size:23px}
    p{line-height:1.7;color:#7c2d12}
    .warning{padding:12px;border-radius:12px;background:#ffedd5;color:#9a3412;font-weight:800}
    .btn{min-height:48px;display:flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:#ea580c;color:#fff;font:inherit;font-weight:900;text-decoration:none;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .small{font-size:12px;color:#9a3412}
    .splash{position:fixed;inset:0;display:grid;place-items:center;background:#fff7ed;z-index:10}
    .splash-inner{display:grid;gap:14px;text-align:center;font-weight:800}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    .test-badge{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:30;padding:5px 8px;border-radius:999px;background:rgba(154,52,18,.86);color:#fff;font-size:11px;font-weight:900;pointer-events:none}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <main id="setup" class="card">
    <img class="icon" src="../app_icon.png" alt="">
    <h1>会議室予約 v1.4 テスト</h1>
    <p class="warning">これは本番とは別の動作確認用ショートカットです。</p>
    <p id="status">このページをホーム画面へ追加し、「予約TEST」のアイコンから起動してください。</p>
    <button id="openButton" class="btn" type="button">テスト版をブラウザで開く</button>
    <p class="small">既存の本番ショートカットと本番デプロイ @113 は変更されません。</p>
  </main>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwK7UPx7YULBvnvmTmFrcbbxd_qhTDvV7Nweun18MozifJJ5n620l7ErGM95COCRsVLMg/exec';
    const APP_BUILD = 'v1.4.0-test-118';
    const STORAGE_KEY = 'roomBookingAssistantAccessKey';
    const params = new URLSearchParams(location.search);
    const urlAccess = params.get('access') || '';
    const storedAccess = localStorage.getItem(STORAGE_KEY) || '';
    const access = urlAccess || storedAccess;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

    if (access) localStorage.setItem(STORAGE_KEY, access);

    function targetAppUrl() {
      const target = new URL(APP_URL);
      if (access) target.searchParams.set('access', access);
      target.searchParams.set('v', APP_BUILD);
      target.searchParams.set('t', String(Date.now()));
      return target.toString();
    }

    function openApp() {
      location.replace(targetAppUrl());
    }

    function showMissingAccess() {
      document.getElementById('status').textContent = '認証情報がありません。管理者から発行されたURLの access パラメータを付けて、このページを開いてください。';
      document.getElementById('openButton').disabled = true;
    }

    function embedApp() {
      document.getElementById('setup').classList.add('hidden');
      const splash = document.createElement('div');
      splash.className = 'splash';
      splash.innerHTML = '<div class="splash-inner"><img class="icon" src="../app_icon.png" alt=""><span>v1.4 テスト版を起動中…</span></div>';
      document.body.appendChild(splash);

      const frame = document.createElement('iframe');
      let loaded = false;
      frame.addEventListener('load', () => {
        loaded = true;
        setTimeout(() => splash.classList.add('hidden'), 600);
      });
      frame.src = targetAppUrl();
      document.body.appendChild(frame);

      const badge = document.createElement('div');
      badge.className = 'test-badge';
      badge.textContent = 'TEST @118';
      document.body.appendChild(badge);
      setTimeout(() => { if (!loaded) openApp(); }, 8000);
    }

    document.getElementById('openButton').addEventListener('click', openApp);
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {});

    if (!access) showMissingAccess();
    else if (isStandalone) embedApp();
  </script>
</body>
</html>
